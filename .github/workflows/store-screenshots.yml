name: Store screenshots

# Takes the Google Play screenshots (bg + en) on an Android emulator with demo data.
# First run "Android APK + AAB" by hand with "preview" ticked, then run this with that run's id.
# Result: artifact "store-screenshots" with raw 1080×2400 PNGs; the advert frames are made from them.
on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: 'Run id of an "Android APK + AAB" run with preview ticked'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.preview_run_id }} -n Azqm-Preview-apk-installs-next-to-play -D apk
          ls -la apk
          sqlite3 --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/store-shots/shoot.sh apk/Azqm-Preview.apk shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots
          path: shots
